[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-fraud-detection"
version = "1.0.0"
description = "End-to-end financial fraud detection with XGBoost, PyTorch, GraphSAGE, FastAPI, Streamlit, Docker, and Triton."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiling Cheng"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "torch>=2.2,<3",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
