services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/artifacts/models

  streamlit:
    build: .
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      MODEL_DIR: /app/artifacts/models
